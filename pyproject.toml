[project]
name = "reviewhive"
version = "0.1.0"
description = "ReviewHive: 完全运行于本地模型的代码评审多 Agent 协作平台（Qdrant + Elasticsearch 混合 RAG）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "bulusi" }]
keywords = ["multi-agent", "code-review", "rag", "local-llm", "qdrant", "elasticsearch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "qdrant-client>=1.14,<1.15",
    "elasticsearch>=8.13,<9",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "openai>=1.40",
]

[project.optional-dependencies]
# 本地嵌入与重排模型（bge-m3 / bge-reranker-v2-m3），不装则只能使用外部 embedding 端点
local-models = ["sentence-transformers>=3.0"]
# 下载开源评审/漏洞数据集（CodeReviewer、CodeXGLZ、CodeMRR）
datasets = ["datasets>=2.19"]
# 链路追踪：对接 Arize Phoenix（服务端另起，见 docker-compose.observability.yml）
observability = [
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-otlp-proto-http>=1.25",
    "openinference-semantic-conventions>=0.1",
    "openinference-instrumentation-openai>=0.1",
]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]

[project.scripts]
reviewhive = "reviewhive.cli:app"

[project.urls]
Homepage = "https://github.com/yourname/reviewhive"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["reviewhive"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

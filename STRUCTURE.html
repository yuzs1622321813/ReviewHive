<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ReviewHive — 项目结构</title>
<style>
  :root {
    --bg: #0d1117;
    --surface: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb33;
    --green: #3fb950;
    --orange: #d29922;
    --purple: #bc8cff;
    --red: #f85149;
    --cyan: #39d2c8;
    --folder: #54aeff;
    --file-py: #3572A5;
    --file-js: #f1e05a;
    --file-json: #cb8ef5;
    --file-yaml: #e6417d;
    --file-md: #083fa1;
    --file-html: #e34c26;
    --file-css: #563d7c;
    --file-sh: #89e051;
    --file-java: #b07219;
    --file-docker: #384d54;
    --file-toml: #9c4221;
    --hover: #1c2128;
    --radius: 6px;
    --mono: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    line-height: 1.6;
    padding: 0;
  }

  .header {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 24px 32px;
    position: sticky;
    top: 0;
    z-index: 100;
    backdrop-filter: blur(12px);
  }

  .header h1 {
    font-size: 22px;
    font-weight: 600;
    margin-bottom: 4px;
  }

  .header h1 span { color: var(--accent); }

  .header p {
    color: var(--text-dim);
    font-size: 14px;
  }

  .toolbar {
    display: flex;
    gap: 8px;
    margin-top: 12px;
    flex-wrap: wrap;
    align-items: center;
  }

  .toolbar button {
    background: var(--bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 5px 14px;
    border-radius: var(--radius);
    cursor: pointer;
    font-size: 13px;
    font-family: var(--sans);
    transition: all .15s;
  }

  .toolbar button:hover {
    color: var(--text);
    border-color: var(--accent);
    background: var(--accent-dim);
  }

  .search-box {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    padding: 5px 12px;
    border-radius: var(--radius);
    font-size: 13px;
    font-family: var(--sans);
    width: 220px;
    outline: none;
    transition: border-color .15s;
  }

  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text-dim); }

  .stats {
    margin-left: auto;
    font-size: 12px;
    color: var(--text-dim);
    font-family: var(--mono);
  }

  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px 32px 80px;
  }

  .legend {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 20px;
    padding: 12px 16px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 5px;
    color: var(--text-dim);
  }

  .legend-dot {
    width: 10px;
    height: 10px;
    border-radius: 3px;
    flex-shrink: 0;
  }

  /* Tree styles */
  .tree { list-style: none; }
  .tree .tree { padding-left: 0; }

  .tree-item {
    position: relative;
  }

  .tree-row {
    display: flex;
    align-items: baseline;
    padding: 3px 8px 3px 0;
    border-radius: var(--radius);
    cursor: default;
    transition: background .1s;
    gap: 6px;
  }

  .tree-row:hover { background: var(--hover); }

  .toggle {
    width: 20px;
    height: 20px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    color: var(--text-dim);
    font-size: 11px;
    transition: transform .15s, color .15s;
    user-select: none;
    border-radius: 3px;
  }

  .toggle:hover { color: var(--accent); background: var(--accent-dim); }
  .toggle.collapsed { transform: rotate(-90deg); }
  .toggle.leaf { visibility: hidden; }

  .icon {
    width: 18px;
    height: 18px;
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
  }

  .name {
    font-family: var(--mono);
    font-size: 13.5px;
    white-space: nowrap;
    color: var(--text);
  }

  .name.folder { color: var(--folder); font-weight: 500; }

  .desc {
    color: var(--text-dim);
    font-size: 12.5px;
    margin-left: 8px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    min-width: 0;
  }

  .badge {
    font-size: 10px;
    padding: 1px 6px;
    border-radius: 10px;
    font-family: var(--mono);
    font-weight: 500;
    flex-shrink: 0;
    margin-left: 6px;
  }

  .badge-module { background: #1f6feb22; color: var(--accent); border: 1px solid #1f6feb44; }
  .badge-entry { background: #3fb95022; color: var(--green); border: 1px solid #3fb95044; }
  .badge-static { background: #d2992222; color: var(--orange); border: 1px solid #d2992244; }
  .badge-config { background: #bc8cff22; color: var(--purple); border: 1px solid #bc8cff44; }
  .badge-data { background: #f8514922; color: var(--red); border: 1px solid #f8514944; }
  .badge-ui { background: #39d2c822; color: var(--cyan); border: 1px solid #39d2c844; }

  .children {
    overflow: hidden;
    transition: max-height .2s ease-out;
  }

  .children.hidden {
    max-height: 0 !important;
    overflow: hidden;
  }

  .tree-item.search-hidden { display: none; }
  .tree-row.search-match .name { color: var(--accent); }
  .tree-row.search-match .desc { color: var(--text); }

  mark {
    background: #d299224d;
    color: var(--text);
    border-radius: 2px;
    padding: 0 1px;
  }

  .depth-guides {
    position: relative;
  }

  @media (max-width: 768px) {
    .header { padding: 16px; }
    .container { padding: 16px 12px 60px; }
    .desc { display: none; }
    .search-box { width: 160px; }
    .stats { display: none; }
  }

  .file-count {
    font-size: 11px;
    color: var(--text-dim);
    font-family: var(--mono);
    margin-left: 4px;
    opacity: 0.7;
  }

  .indent-line {
    position: absolute;
    left: 9px;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
    opacity: 0.4;
  }
</style>
</head>
<body>

<div class="header">
  <h1><span>ReviewHive</span> — 项目结构总览</h1>
  <p>完全运行于本地模型的代码评审多 Agent 协作平台 · 点击文件夹展开/折叠，支持搜索过滤</p>
  <div class="toolbar">
    <button onclick="expandAll()">全部展开</button>
    <button onclick="collapseAll()">全部折叠</button>
    <button onclick="expandTo(2)">展开前两层</button>
    <input type="text" class="search-box" id="searchInput" placeholder="搜索文件或描述..." oninput="doSearch(this.value)">
    <span class="stats" id="stats"></span>
  </div>
</div>

<div class="container">
  <div class="legend">
    <div class="legend-item"><div class="legend-dot" style="background:var(--folder)"></div>目录</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-py)"></div>Python</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-js)"></div>JavaScript</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-html)"></div>HTML</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-yaml)"></div>YAML / Config</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-docker)"></div>Docker</div>
    <div class="legend-item"><div class="legend-dot" style="background:var(--file-sh)"></div>Shell</div>
    <div class="legend-item"><span class="badge badge-module">模块</span>核心包</div>
    <div class="legend-item"><span class="badge badge-entry">入口</span>入口文件</div>
    <div class="legend-item"><span class="badge badge-static">静态</span>纯静态分析</div>
    <div class="legend-item"><span class="badge badge-config">配置</span>配置</div>
    <div class="legend-item"><span class="badge badge-data">数据</span>数据/语料</div>
    <div class="legend-item"><span class="badge badge-ui">前端</span>UI</div>
  </div>

  <ul class="tree" id="tree"></ul>
</div>

// File type icon mapping
function getIcon(name, isFolder) {
  if (isFolder) return '<span style="color:var(--folder)">📁</span>';
  const ext = name.split('.').pop().toLowerCase();
  const icons = {
    py: '<span style="color:var(--file-py)">🐍</span>',
    js: '<span style="color:var(--file-js)">JS</span>',
    json: '<span style="color:var(--file-json)">{}</span>',
    yaml: '<span style="color:var(--file-yaml)">⚙</span>',
    yml: '<span style="color:var(--file-docker)">⎕</span>',
    md: '<span style="color:var(--file-md)">M↓</span>',
    html: '<span style="color:var(--file-html)">◇</span>',
    css: '<span style="color:var(--file-css)">#</span>',
    sh: '<span style="color:var(--file-sh)">▶</span>',
    java: '<span style="color:var(--file-java)">☕</span>',
    toml: '<span style="color:var(--file-toml)">⚙</span>',
  };
  if (name === 'Makefile' || name === 'LICENSE') return '<span style="color:var(--text-dim)">📄</span>';
  if (name.startsWith('.git')) return '<span style="color:var(--text-dim)">⚙</span>';
  return icons[ext] || '<span style="color:var(--text-dim)">📄</span>';
}

function getExtColor(name) {
  const ext = name.split('.').pop().toLowerCase();
  const colors = {
    py: 'var(--file-py)', js: 'var(--file-js)', json: 'var(--file-json)',
    yaml: 'var(--file-yaml)', yml: 'var(--file-docker)', md: 'var(--file-md)',
    html: 'var(--file-html)', css: 'var(--file-css)', sh: 'var(--file-sh)',
    java: 'var(--file-java)', toml: 'var(--file-toml)',
  };
  return colors[ext] || 'var(--text-dim)';
}

const badgeClass = { '模块': 'badge-module', '入口': 'badge-entry', '静态': 'badge-static', '配置': 'badge-config', '数据': 'badge-data', '前端': 'badge-ui' };

let totalFiles = 0;
let totalFolders = 0;

function buildTree(node, depth = 0) {
  const li = document.createElement('li');
  li.className = 'tree-item';
  li.dataset.depth = depth;

  const row = document.createElement('div');
  row.className = 'tree-row';
  row.style.paddingLeft = (depth * 24 + 4) + 'px';

  const isFolder = !!node.c;
  if (isFolder) totalFolders++; else totalFiles++;

  // Toggle arrow
  const toggle = document.createElement('span');
  toggle.className = 'toggle' + (isFolder ? '' : ' leaf');
  toggle.textContent = '▼';
  if (isFolder && depth >= 2) toggle.classList.add('collapsed');
  row.appendChild(toggle);

  // Icon
  const icon = document.createElement('span');
  icon.className = 'icon';
  icon.innerHTML = getIcon(node.n, isFolder);
  row.appendChild(icon);

  // Name
  const name = document.createElement('span');
  name.className = 'name' + (isFolder ? ' folder' : '');
  name.textContent = node.n;
  if (!isFolder) name.style.color = getExtColor(node.n);
  name.dataset.searchable = node.n;
  row.appendChild(name);

  // Description
  if (node.d) {
    const desc = document.createElement('span');
    desc.className = 'desc';
    desc.textContent = node.d;
    desc.dataset.searchable = node.d;
    row.appendChild(desc);
  }

  // Badges
  if (node.b) {
    node.b.forEach(b => {
      const badge = document.createElement('span');
      badge.className = 'badge ' + (badgeClass[b] || 'badge-module');
      badge.textContent = b;
      row.appendChild(badge);
    });
  }

  // File count for folders
  if (isFolder) {
    const count = document.createElement('span');
    count.className = 'file-count';
    const cnt = countNodes(node.c);
    count.textContent = cnt + ' 项';
    row.appendChild(count);
  }

  li.appendChild(row);

  // Children
  if (isFolder && node.c) {
    const childUl = document.createElement('ul');
    childUl.className = 'tree children' + (depth >= 2 ? ' hidden' : '');
    node.c.forEach(child => {
      childUl.appendChild(buildTree(child, depth + 1));
    });
    li.appendChild(childUl);

    toggle.addEventListener('click', (e) => {
      e.stopPropagation();
      const isHidden = childUl.classList.contains('hidden');
      if (isHidden) {
        childUl.classList.remove('hidden');
        childUl.style.maxHeight = childUl.scrollHeight + 500 + 'px';
        toggle.classList.remove('collapsed');
      } else {
        childUl.classList.add('hidden');
        childUl.style.maxHeight = '0px';
        toggle.classList.add('collapsed');
      }
    });

    row.addEventListener('click', () => toggle.click());

    // Set initial max-height for expanded nodes
    if (depth < 2) {
      setTimeout(() => {
        childUl.style.maxHeight = 'none';
      }, 0);
    }
  }

  return li;
}

function countNodes(arr) {
  if (!arr) return 0;
  let count = arr.length;
  arr.forEach(n => { if (n.c) count += countNodes(n.c); });
  return count;
}

// Init
const treeEl = document.getElementById('tree');
treeEl.appendChild(buildTree(DATA));
document.getElementById('stats').textContent = `${totalFolders} 个目录 · ${totalFiles} 个文件`;

// Expand all
function expandAll() {
  document.querySelectorAll('.children').forEach(el => {
    el.classList.remove('hidden');
    el.style.maxHeight = 'none';
  });
  document.querySelectorAll('.toggle').forEach(t => t.classList.remove('collapsed'));
}

// Collapse all
function collapseAll() {
  document.querySelectorAll('.children').forEach(el => {
    el.classList.add('hidden');
    el.style.maxHeight = '0px';
  });
  document.querySelectorAll('.toggle:not(.leaf)').forEach(t => t.classList.add('collapsed'));
}

// Expand to depth
function expandTo(maxDepth) {
  collapseAll();
  document.querySelectorAll('.tree-item').forEach(item => {
    const d = parseInt(item.dataset.depth);
    if (d < maxDepth) {
      const children = item.querySelector(':scope > .children');
      if (children) {
        children.classList.remove('hidden');
        children.style.maxHeight = 'none';
        const t = item.querySelector(':scope > .tree-row > .toggle');
        if (t) t.classList.remove('collapsed');
      }
    }
  });
}

// Search
function doSearch(query) {
  const q = query.toLowerCase().trim();
  const items = document.querySelectorAll('.tree-item');

  if (!q) {
    items.forEach(item => {
      item.classList.remove('search-hidden');
      const row = item.querySelector(':scope > .tree-row');
      row.classList.remove('search-match');
      // Restore original text (remove marks)
      row.querySelectorAll('.name, .desc').forEach(el => {
        el.innerHTML = el.textContent;
      });
    });
    return;
  }

  // First pass: mark matches
  items.forEach(item => {
    const row = item.querySelector(':scope > .tree-row');
    const nameEl = row.querySelector('.name');
    const descEl = row.querySelector('.desc');
    const nameText = (nameEl.dataset.searchable || nameEl.textContent).toLowerCase();
    const descText = descEl ? (descEl.dataset.searchable || descEl.textContent).toLowerCase() : '';
    const match = nameText.includes(q) || descText.includes(q);

    row.classList.toggle('search-match', match);

    // Highlight
    [nameEl, descEl].forEach(el => {
      if (!el) return;
      const orig = el.dataset.searchable || el.textContent;
      if (orig.toLowerCase().includes(q)) {
        const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
        el.innerHTML = orig.replace(regex, '<mark>$1</mark>');
      } else {
        el.innerHTML = el.textContent;
      }
    });
  });

  // Second pass: show matches + their ancestors
  items.forEach(item => item.classList.add('search-hidden'));

  items.forEach(item => {
    const row = item.querySelector(':scope > .tree-row');
    if (row.classList.contains('search-match')) {
      item.classList.remove('search-hidden');
      // Show all ancestors
      let parent = item.parentElement;
      while (parent) {
        if (parent.classList && parent.classList.contains('tree-item')) {
          parent.classList.remove('search-hidden');
          const ch = parent.querySelector(':scope > .children');
          if (ch) {
            ch.classList.remove('hidden');
            ch.style.maxHeight = 'none';
            const t = parent.querySelector(':scope > .tree-row > .toggle');
            if (t) t.classList.remove('collapsed');
          }
        }
        parent = parent.parentElement;
      }
    }
  });
}

// Keyboard shortcut: / to focus search
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement.tagName !== 'INPUT') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
  if (e.key === 'Escape') {
    const input = document.getElementById('searchInput');
    if (document.activeElement === input) {
      input.value = '';
      doSearch('');
      input.blur();
    }
  }
});
